appId: app.mora.editor
productName: Mora
asar: true

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - src/styles/**/*.css
  - build/icon.ico
  - package.json

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: Mora-${version}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mora
  uninstallDisplayName: Mora

portable:
  artifactName: Mora-${version}-Portable.${ext}
