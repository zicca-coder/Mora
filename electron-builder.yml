appId: app.mora.editor
productName: Mora
asar: true

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - src/styles/**/*.css
  - node_modules/highlight.js/styles/github.css
  - build/icon.ico
  - package.json

win:
  icon: build/icon.ico
  signExecutable: false
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: Mora-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mora
  uninstallDisplayName: Mora
